name: Hensun firmware build matrix

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag, or branch to build
        required: true
        default: main
  schedule:
    - cron: "18 3 * * 1"

permissions:
  contents: read

jobs:
  build-hensun-matrix:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    container:
      image: espressif/idf:v6.0.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: hensun-cam-selfhosted-v1
            board: hensun/hensun-cam-pilot-v1
          - variant: hensun-cam-selfhosted-landscape-local-v1
            board: hensun/hensun-cam-pilot-v1
          - variant: hensun-cam-official-v1
            board: hensun/hensun-cam-pilot-v1
          - variant: hensun-cam-emote-lab-v1
            board: hensun/hensun-cam-pilot-v1
          - variant: hensun-nocam-selfhosted-v1
            board: hensun/hensun-nocam-pilot-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Check generated Hensun resources
        run: |
          python firmware/xiaozhi-esp32/main/boards/hensun/hensun-cam-pilot-v1/tools/generate_display_profile.py --check
          python firmware/xiaozhi-esp32/main/boards/hensun/hensun-cam-pilot-v1/tools/generate_dialogue_face_previews.py --check
          python firmware/xiaozhi-esp32/main/boards/hensun/hensun-cam-pilot-v1/tools/generate_emote_lab_assets.py --check
      - name: Verify local build uses a non-routable CI endpoint
        if: matrix.variant == 'hensun-cam-selfhosted-landscape-local-v1'
        run: |
          grep -F 'CONFIG_OTA_URL="https://api.hensun.invalid/v1/device/xiaozhi-bootstrap"' \
            firmware/xiaozhi-esp32/main/boards/hensun/hensun-cam-pilot-v1/config.json
      - name: Build selected Hensun variant
        working-directory: firmware/xiaozhi-esp32
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py "${{ matrix.board }}" --name "${{ matrix.variant }}"
      - name: Check non-CAM application and asset capacity
        if: matrix.variant == 'hensun-nocam-selfhosted-v1'
        working-directory: firmware/xiaozhi-esp32
        run: |
          python - <<'PY'
          from pathlib import Path

          limits = {
              Path("build/xiaozhi.bin"): 0x3f0000,
              Path("build/generated_assets.bin"): 0x7fc000,
          }
          for path, limit in limits.items():
              size = path.stat().st_size
              if size > limit:
                  raise SystemExit(f"{path} exceeds partition: {size} > {limit}")
              print(f"{path}: {size}/{limit} bytes")
          PY
      - name: Produce signed-input manifest (not a signing operation)
        working-directory: firmware/xiaozhi-esp32
        run: |
          mkdir -p ci-artifacts
          cp build/xiaozhi.bin ci-artifacts/${{ matrix.variant }}.bin
          sha256sum ci-artifacts/${{ matrix.variant }}.bin > ci-artifacts/${{ matrix.variant }}.sha256
          printf '0x20000 %s.bin\n' "${{ matrix.variant }}" > ci-artifacts/${{ matrix.variant }}.flash-addresses.txt
          if [ "${{ matrix.variant }}" = "hensun-nocam-selfhosted-v1" ]; then
            cp build/generated_assets.bin ci-artifacts/${{ matrix.variant }}-assets.bin
            sha256sum ci-artifacts/${{ matrix.variant }}-assets.bin >> ci-artifacts/${{ matrix.variant }}.sha256
            printf '0x804000 %s-assets.bin\n' "${{ matrix.variant }}" >> ci-artifacts/${{ matrix.variant }}.flash-addresses.txt
          fi
          printf '%s\n' \
            'CI compile proof only.' \
            'Not signed, not configured for a real endpoint, and not approved for field flashing.' \
            > ci-artifacts/CI_ONLY_DO_NOT_FLASH.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ci-only-${{ matrix.variant }}-${{ github.sha }}
          path: firmware/xiaozhi-esp32/ci-artifacts
          if-no-files-found: error
          retention-days: 7
