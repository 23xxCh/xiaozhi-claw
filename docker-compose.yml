services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hensun_desk
      MYSQL_USER: hensun
      MYSQL_PASSWORD: local-development-only
      MYSQL_ROOT_PASSWORD: local-root-development-only
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uhensun", "-plocal-development-only"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: mysql+asyncmy://hensun:local-development-only@mysql:3306/hensun_desk
      ADMIN_API_KEY: development-admin-change-me
      JWT_SECRET: development-jwt-change-me
      DEVICE_CREDENTIAL_PEPPER: development-device-pepper-change-me
      MEMORY_MASTER_KEY: development-memory-key-change-me
      PROVIDER_MODE: mock
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:

