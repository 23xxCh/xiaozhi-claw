# Formal vhosts. Do not install before the exact production-publication approval.
server {
    listen 80;
    listen [::]:80;
    server_name hensun-desk.top www.hensun-desk.top api.hensun-desk.top voice.hensun-desk.top ota.hensun-desk.top;

    location ^~ /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:13003;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hensun-desk.top;

    ssl_certificate /usr/local/openresty/nginx/conf/ssl/hensun-desk/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/hensun-desk/privkey.pem;
    client_max_body_size 2m;

    location = /v1/device/ws {
        proxy_pass http://127.0.0.1:13002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:13001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.hensun-desk.top;
    ssl_certificate /usr/local/openresty/nginx/conf/ssl/hensun-desk/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/hensun-desk/privkey.pem;
    return 301 https://hensun-desk.top$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.hensun-desk.top ota.hensun-desk.top;
    ssl_certificate /usr/local/openresty/nginx/conf/ssl/hensun-desk/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/hensun-desk/privkey.pem;
